<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2458B8"><title>Minhas Notas</title><style>
*{box-sizing:border-box}body{margin:0;background:#101B34;color:#fff;font:16px system-ui,Arial}.app{max-width:650px;margin:auto;padding:14px}.header{background:#2458B8;border-radius:20px;padding:18px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.top h1{font-size:25px;margin:0}.add{background:#FFD43B!important;color:#142747!important;font-weight:800;border-radius:30px;appearance:none;-webkit-appearance:none}.month{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}.month strong{font-size:18px}.counter{background:white;color:#2458B8;padding:8px 19px;border-radius:12px;font-size:27px;font-weight:800}.nav{display:flex;gap:8px;margin:16px 0}.nav button{flex:1}.nav button.active{background:#2458B8}button{border:0;border-radius:11px;padding:12px 14px;background:#334767;color:white;font:inherit;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #FFD43B}button.back{flex:0 0 44px}.panel{background:#1C2D4D;border-radius:17px;padding:14px;margin-top:12px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{min-height:43px;padding:6px 1px;border-radius:8px;background:#293B5C;position:relative}.day.marked{background:#2458B8}.day.selected{background:#FFD43B;color:#142747}.day i{display:block;width:5px;height:5px;background:#FFD43B;border-radius:50%;margin:3px auto 0}.day.selected i{background:#142747}.day.blank{background:transparent}.weekday{text-align:center;font-size:12px;color:#c7d4eb;padding:6px 0}.note{border-radius:14px;padding:14px;margin:10px 0;background:#2867C4}.note.personal{background:#8050B7}.note.overdue{background:#B52F45}.note.done{background:#18834F}.note h3{margin:0 0 6px;font-size:18px}.note p{margin:5px 0}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;border:1px solid #ffffff99;background:#ffffff18}.note{touch-action:pan-y;user-select:none;-webkit-user-select:none}.muted{color:#c7d4eb;font-size:13px}form label{display:block;margin:14px 0 5px;font-weight:600}input,textarea,select{width:100%;border:1px solid #a6b8d5;border-radius:10px;padding:12px;font:inherit;background:#10213D!important;color:#FFFFFF!important;-webkit-text-fill-color:#FFFFFF;caret-color:#FFD43B;color-scheme:dark}input::placeholder,textarea::placeholder{color:#D6E2F5!important;opacity:1}select option{background:#10213D;color:#FFFFFF}textarea{min-height:85px}.formactions{display:flex;gap:8px;margin-top:18px}.formactions button{flex:1}.primary{background:#2458B8}.hidden{display:none}.intro{text-align:center;padding:24px 8px}.intro h2{margin:0 0 8px}.small{font-size:12px;color:#b6c6e0;text-align:center;margin:22px 0}
</style></head><body><main class="app"><header class="header"><div class="top"><h1>▣ Minhas Notas</h1><button class="add" id="add">＋ Adicionar</button></div><div class="month"><button id="prev" aria-label="Mês anterior">❮</button><strong id="monthLabel">Novembro 2026</strong><button id="next" aria-label="Próximo mês">❯</button></div><div class="row"><span>Pendências em aberto</span><span class="counter" id="counter">0</span></div></header><noscript><p class="panel">Para usar os botões, abra este arquivo no navegador Chrome com JavaScript ativado.</p></noscript><section id="main"><div class="nav"><button class="back hidden" id="back" aria-label="Voltar">←</button><button id="listBtn">☷ Lista</button><button id="monthBtn">▦ Mês</button></div><div id="content"></div></section><section id="editor" class="panel hidden"><h2 id="formTitle">Nova pendência</h2><form id="form"><label for="title">Descrição</label><textarea id="title" required placeholder="Digite sua anotação"></textarea><label for="category">Categoria</label><select id="category"><option>Trabalho</option><option>Particular</option></select><label for="date">Data (opcional)</label><input id="date" type="date"><div class="formactions"><button class="primary" type="submit">Salvar</button><button type="button" id="cancel">Voltar</button></div></form></section><dialog id="noteMenu" style="border:0;border-radius:16px;background:#1C2D4D;color:white;padding:22px;max-width:90%;width:320px"><h3 style="margin-top:0">O que deseja fazer?</h3><p id="menuTitle" class="muted"></p><div style="display:grid;gap:9px"><button id="menuEdit" class="primary">Editar</button><button id="menuDelete" style="background:#B52F45">Excluir</button><button id="menuCancel">Cancelar</button></div></dialog><p class="small">As notas ficam salvas neste navegador e neste aparelho. Limpar os dados do navegador pode apagá-las.</p></main><script>
(()=>{'use strict';const KEY='minhas-notas-v1',VIEW='minhas-notas-view-v1';let notes=[];try{notes=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(notes))notes=[]}catch{}const $=id=>document.getElementById(id);const now=()=>new Date(),ym=(y,m)=>`${y}-${String(m+1).padStart(2,'0')}`,today=()=>{let d=now();return `${ym(d.getFullYear(),d.getMonth())}-${String(d.getDate()).padStart(2,'0')}`};let y=now().getFullYear(),m=now().getMonth(),view='inicio',selected=null,editing=null;const monthNames=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];const persist=()=>localStorage.setItem(KEY,JSON.stringify(notes));function rollover(){const current=ym(now().getFullYear(),now().getMonth());let changed=false;notes.forEach(n=>{if(!n.done&&n.month<current){n.month=current;changed=true}});if(changed)persist()}function visible(){let key=ym(y,m);return notes.filter(n=>n.done?n.completedMonth===key:n.month===key)}function sorted(a){return [...a].sort((x,z)=>{const rank=n=>n.done?2:n.date&&n.date<today()?0:1;return rank(x)-rank(z)||(x.date||'9999').localeCompare(z.date||'9999')})}function card(n){const el=document.createElement('article');el.className='note'+(n.done?' done':n.date&&n.date<today()?' overdue':n.category==='Particular'?' personal':'');const h=document.createElement('h3');h.textContent=n.title;el.append(h);const p=document.createElement('p');p.textContent=(n.done?'Concluída':n.date&&n.date<today()?'Atrasada':n.category)+' · '+(n.date?n.date.split('-').reverse().join('/'):'Sem data');el.append(p);const actions=document.createElement('div');actions.className='actions';const b=document.createElement('button');b.textContent=n.done?'Reabrir':'Concluir';b.onclick=()=>{n.done=!n.done;n.completedMonth=n.done?ym(y,m):null;n.month=ym(y,m);persist();render()};actions.append(b);el.append(actions);
let timer=null, startX=0,startY=0, fired=false;
const stop=()=>{if(timer!==null){clearTimeout(timer);timer=null}};
el.addEventListener('pointerdown',ev=>{if(ev.target.closest('button'))return;fired=false;startX=ev.clientX;startY=ev.clientY;stop();timer=setTimeout(()=>{timer=null;fired=true;showMenu(n)},650)});
el.addEventListener('pointermove',ev=>{if(Math.abs(ev.clientX-startX)>12||Math.abs(ev.clientY-startY)>12)stop()});
['pointerup','pointercancel','pointerleave'].forEach(event=>el.addEventListener(event,stop));
el.addEventListener('contextmenu',ev=>{ev.preventDefault();stop();if(!fired)showMenu(n)});
return el}let menuNote=null;
function showMenu(n){menuNote=n;$('menuTitle').textContent=n.title;$('noteMenu').showModal()}
$('menuCancel').onclick=()=>$('noteMenu').close();
$('menuEdit').onclick=()=>{const n=menuNote;$('noteMenu').close();if(n)openEditor(n)};
$('menuDelete').onclick=()=>{const n=menuNote;$('noteMenu').close();if(n&&window.confirm('Tem certeza que deseja excluir esta nota?')){notes=notes.filter(item=>item.id!==n.id);persist();render()}};
$('noteMenu').addEventListener('close',()=>{menuNote=null});
function showNotes(arr,host){if(!arr.length){const p=document.createElement('p');p.className='muted';p.textContent='Nenhuma anotação nesta seleção.';host.append(p)}else sorted(arr).forEach(n=>host.append(card(n)))}function render(){rollover();$('monthLabel').textContent=monthNames[m]+' '+y;$('counter').textContent=visible().filter(n=>!n.done).length;$('back').classList.toggle('hidden',view==='inicio');$('listBtn').classList.toggle('active',view==='lista');$('monthBtn').classList.toggle('active',view==='mes');$('main').classList.toggle('hidden',!$('editor').classList.contains('hidden'));const content=$('content');content.replaceChildren();if(view==='inicio'){const box=document.createElement('div');box.className='panel intro';box.innerHTML='<h2>Tudo organizado!</h2><p class="muted">Escolha Lista ou Mês para consultar suas anotações.</p>';content.append(box);return}if(view==='lista'){showNotes(visible(),content);return}const box=document.createElement('div');box.className='panel';const cal=document.createElement('div');cal.className='calendar';['D','S','T','Q','Q','S','S'].forEach(t=>{let d=document.createElement('div');d.className='weekday';d.textContent=t;cal.append(d)});let offset=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<offset;i++){let b=document.createElement('div');b.className='day blank';cal.append(b)}for(let day=1;day<=days;day++){let b=document.createElement('button');b.className='day';b.textContent=day;const ds=`${ym(y,m)}-${String(day).padStart(2,'0')}`;if(visible().some(n=>n.date===ds)){b.classList.add('marked');let dot=document.createElement('i');b.append(dot)}if(selected===day)b.classList.add('selected');b.onclick=()=>{selected=day;render()};cal.append(b)}box.append(cal);const p=document.createElement('p');p.className='muted';p.textContent='Dias em azul com ponto amarelo têm anotações. Toque para consultar.';box.append(p);content.append(box);if(selected!==null){let h=document.createElement('h3');h.textContent=`Dia ${selected} de ${monthNames[m]}`;content.append(h);showNotes(visible().filter(n=>n.date===`${ym(y,m)}-${String(selected).padStart(2,'0')}`),content)}}function openEditor(n){editing=n?n.id:null;$('formTitle').textContent=n?'Editar pendência':'Nova pendência';$('title').value=n?n.title:'';$('category').value=n?n.category:'Trabalho';$('date').value=n?n.date:'';$('editor').classList.remove('hidden');$('main').classList.add('hidden');window.scrollTo(0,0)}function closeEditor(){$('editor').classList.add('hidden');$('main').classList.remove('hidden');render()}$('form').onsubmit=e=>{e.preventDefault();let title=$('title').value.trim();if(!title)return;let date=$('date').value,category=$('category').value;if(editing!==null){let n=notes.find(n=>n.id===editing);if(n){n.title=title;n.date=date;n.category=category}}else notes.push({id:Date.now()+'-'+Math.random(),title,date,category,done:false,month:ym(y,m),completedMonth:null});persist();view='lista';selected=null;closeEditor()};$('add').onclick=()=>openEditor(null);$('cancel').onclick=closeEditor;$('listBtn').onclick=()=>{view='lista';selected=null;render()};$('monthBtn').onclick=()=>{view='mes';selected=null;render()};$('back').onclick=()=>{view='inicio';selected=null;render()};function changeMonth(n){let d=new Date(y,m+n,1);y=d.getFullYear();m=d.getMonth();selected=null;render()}$('prev').onclick=()=>changeMonth(-1);$('next').onclick=()=>changeMonth(1);render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()})})();
</script></body></html>
